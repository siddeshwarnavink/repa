{% extends 'base.html' %}

{% block head %}{% endblock %}

{% block content %}
<div class="page-card">
  <h1>Running processes</h1>
  <table>
    <thead>
      <tr>
        <th>Job Title</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      {% for process in processes %}
      <tr>
        <td>
          <a href="{% url 'queue-item' process.id %}">
            {{ process.job_title }}
          </a>
        </td>
        <td>{{ process.get_status_display }}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="6">No processes found.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
  <head>
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Repa</title>
	{% load static %}
	<link rel="stylesheet" href="{% static 'css/main.css' %}" />
	{% block head %}{% endblock %}
  </head>
  <body>
	<ul class="navbar">
	  <li>
		<a href="{% url 'initiate' %}"
		   class="{% if request.resolver_match.url_name == 'initiate' %}active{% endif %}">
		  Initiate
		</a>
	  </li>
	  <li>
		<a href="{% url 'queue' %}"
		   class="{% if request.resolver_match.url_name == 'queue' or request.resolver_match.url_name == 'queue-item' %}active{% endif %}">
		  Queue
		</a>
	  </li>
	</ul>
	<main class="container">
	  {% block content %}{% endblock %}
	</main>
  </body>
</html>
